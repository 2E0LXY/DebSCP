name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest ruff
      - run: ruff check src tests
      - run: pytest

  debian-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update
      - run: sudo apt-get install -y build-essential debhelper dh-python devscripts pybuild-plugin-pyproject python3-all python3-setuptools
      - run: dpkg-buildpackage --no-sign
      - run: mkdir -p artifacts && cp ../debscp_*.deb artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: debscp-debian-package
          path: artifacts/*.deb
