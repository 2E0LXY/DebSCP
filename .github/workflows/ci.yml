name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test]'
      - run: python tools/compile_translations.py
      - run: ruff check src tests
      - run: ruff format --check .
      - run: mypy src
      - run: bandit -q -r src
      - run: pytest

  debian-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update
      - run: sudo apt-get install -y build-essential debhelper dh-python devscripts pybuild-plugin-pyproject python3-all python3-setuptools
      - run: python3 tools/compile_translations.py
      - run: dpkg-buildpackage --no-sign
      - name: Verify version-independent Python install path
        run: |
          package=$(find .. -maxdepth 1 -name 'debscp_*_all.deb' -print -quit)
          dpkg-deb --contents "$package" | grep -q './usr/lib/python3/dist-packages/debscp/__init__.py'
          if dpkg-deb --contents "$package" | grep -Eq './usr/lib/python3\.[0-9]+/dist-packages/debscp/'; then
            echo 'Package incorrectly uses a build-runner-specific Python path' >&2
            exit 1
          fi
      - run: mkdir -p artifacts && cp ../debscp_*.deb artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: debscp-debian-package
          path: artifacts/*.deb
