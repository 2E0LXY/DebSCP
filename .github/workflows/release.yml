name: Release Debian package

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update
      - run: sudo apt-get install -y build-essential debhelper dh-python devscripts pybuild-plugin-pyproject python3-all python3-setuptools
      - run: dpkg-buildpackage --no-sign
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ../debscp_*.deb

