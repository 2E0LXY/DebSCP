[build-system]
requires = ["setuptools>=66", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "debscp"
version = "0.5.1"
description = "Native Linux multi-protocol file transfer client inspired by WinSCP"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "DebSCP contributors"}]
dependencies = ["boto3>=1.26", "defusedxml>=0.7.1", "keyring>=23", "paramiko>=2.12", "requests>=2.28", "scp>=0.14"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: X11 Applications",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: File Transfer Protocol (FTP)",
]

[project.optional-dependencies]
test = ["bandit>=1.7", "build>=1.2", "mypy>=1.10", "pytest>=8", "ruff>=0.8"]

[project.scripts]
debscp = "debscp.cli:main"
debscp-send = "debscp.shell:main"

[project.gui-scripts]
debscp-gui = "debscp.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
debscp = ["locale/*/LC_MESSAGES/*.mo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
ignore_missing_imports = true
